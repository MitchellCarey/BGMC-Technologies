  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:16px;\">\n        <div style=\"background:#100f0d; border:1px solid #2a2620; border-radius:12px; padding:26px; display:flex; flex-direction:column; gap:0;\" style-hover=\"border-color:#3a3026;\">\n          <div style=\"font-family:'Geist Mono', monospace; font-size:12px; color:#6f685e; margin-bottom:16px;\">LEAK 01<\u002Fdiv>\n          <h3 style=\"font-size:18px; font-weight:700; margin:0 0 10px;\">They land, then leave<\u002Fh3>\n          <p style=\"font-size:14px; line-height:1.55; color:#9a9286; margin:0 0 18px; flex:1;\">Your site doesn't make the next step obvious, so visitors bounce before they ever become a lead.<\u002Fp>\n          <p style=\"font-size:13.5px; line-height:1.5; margin:0; color:#cfc8bc;\"><span style=\"font-family:'Geist Mono', monospace; font-size:11px; color:#e6a92e;\">THE FIX&nbsp;&nbsp;<\u002Fspan>Landing pages and enquiry flows with one clear path to \"contact us\".<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#100f0d; border:1px solid #2a2620; border-radius:12px; padding:26px; display:flex; flex-direction:column;\" style-hover=\"border-color:#3a3026;\">\n          <div style=\"font-family:'Geist Mono', monospace; font-size:12px; color:#6f685e; margin-bottom:16px;\">LEAK 02<\u002Fdiv>\n          <h3 style=\"font-size:18px; font-weight:700; margin:0 0 10px;\">They enquire, then wait<\u002Fh3>\n          <p style=\"font-size:14px; line-height:1.55; color:#9a9286; margin:0 0 18px; flex:1;\">The enquiry sits in an inbox until tonight. Meanwhile they've messaged two competitors.<\u002Fp>\n          <p style=\"font-size:13.5px; line-height:1.5; margin:0; color:#cfc8bc;\"><span style=\"font-family:'Geist Mono', monospace; font-size:11px; color:#e6a92e;\">THE FIX&nbsp;&nbsp;<\u002Fspan>AI triage and drafted replies within seconds. You just approve.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"backgro y:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; padding-top:20px;\">\n        <span style=\"font-family:'Geist Mono', monospace; font-size:11.5px; color:#7a746a;\">© 2026 BGMC Technologies<\u002Fspan>\n        <span style=\"font-family:'Geist Mono', monospace; font-size:11.5px; color:#7a746a;\">We find what's broken, then we build the fix.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- MOBILE STICKY CTA -->\n  <sc-if value=\"{{ showStickyCta }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"v2-sticky-cta\" data-screen-label=\"Mobile sticky CTA\" style=\"position:fixed; bottom:0; left:0; right:0; z-index:60; align-items:center; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(16,15,13,0.92); backdrop-filter:blur(12px); border-top:1px solid #2a2620;\">\n      <a href=\"#fixlist\" style=\"flex:1; display:flex; align-items:center; justify-content:center; min-height:48px; padding:10px 12px; text-align:center; line-height:1.2; font-size:15px; font-weight:700; color:#100f0d; background:#e6a92e; border-radius:8px; text-decoration:none; white-space:nowrap;\" style-hover=\"background:#f0b94a;\">Find my three leaks, free<\u002Fa>\n      <a href=\"https://calendar.google.com/calendar/appointments/schedules/AcZssZ06oSuceWF8xnICMZ1sJU9VgfNt5tZp4dZlgmddoUFGLeEx4iO7iPsVqTscvzn3fHmMEgHqyZLf?gv=true\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"v2-sticky-book\" style=\"display:flex; align-items:center; justify-content:center; min-height:48px; padding:0 16px; font-size:14px; font-weight:600; color:#d8d1c5; border:1px solid #3a3530; border-radius:8px; text-decoration:none; white-space:nowrap;\" style-hover=\"border-color:#5a5248;\">Book a call<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;heroAngle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;leaking&quot;,&quot;options&quot;:[&quot;leaking&quot;,&quot;ignored&quot;,&quot;speed&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;autoDemo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;AI demo&quot;},&quot;showPricing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showStickyCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    demoStep: 0,\n    name: \"\", email: \"\", link: \"\", detail: \"\", budget: \"\",\n    submitted: false, submitting: false, submissionError: \"\",\n  };\n\n  componentDidMount() {\n    if (this.props.autoDemo ?? true) this.playDemo();\n    else this.setState({ demoStep: 5 });\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  playDemo() {\n    clearTimeout(this._t);\n    this.setState({ demoStep: 0 });\n    const tick = () => {\n      this.setState((s) => ({ demoStep: Math.min(s.demoStep + 1, 5) }));\n      if (this.state.demoStep < 5) {\n        this._t = setTimeout(tick, this.state.demoStep === 3 ? 2100 : 1400);\n      } else {\n        this._t = setTimeout(() => this.playDemo(), 6000);\n      }\n    };\n    this._t = setTimeout(tick, 900);\n  }\n\n  row(i) {\n    const on = this.state.demoStep >= i;\n    return \"transition:opacity .5s ease, transform .5s ease; \" +\n      (on ? \"opacity:1; transform:none;\" : \"opacity:0; transform:translateY(8px);\");\n  }\n\n  chip(active) {\n    const base = \"appearance:none; -webkit-appearance:none; display:inline-flex; align-items:center; min-height:37px; font-size:13px; line-height:1.2; padding:9px 14px; border-radius:7px; cursor:pointer; font-family:'Geist', sans-serif; transition:all .14s; border:1px solid;\";\n    return active\n      ? base + \" background:#e6a92e; border-color:#e6a92e; color:#100f0d; font-weight:600;\"\n      : base + \" background:#16130f; border-color:#2e2a24; color:#b4ada1; font-weight:500;\";\n  }\n\n  async submitForm() {\n    const s = this.state;\n    if (s.submitting) return;\n    const email = s.email.trim();\n    const hasTarget = s.link.trim() || s.detail.trim();\n    if (!s.name.trim() || !email || !hasTarget) {\n      this.setState({ submissionError: \"Please add your name, email, and either a link or short description.\" });\n      return;\n    }\n    const budgetLabels = { a: \"Under £1k\", b: \"£1k–£3k\", c: \"£3k–£5k\", d: \"£5k+\", e: \"Not sure yet\" };\n    this.setState({ submitting: true, submissionError: \"\" });\n    try {\n      const response = await fetch(\"https://api.web3forms.com/submit\", {\n        method: \"POST\",\n        headers: { \"Content-Type\": \"application/json\", \"Accept\": \"application/json\" },\n        body: JSON.stringify({\n          access_key: \"77c62024-fd7e-487e-a77d-beebe8184b4b\",\n          subject: \"New 3-Point Fix List request\",\n          from_name: \"BGMC Technologies\",\n          name: s.name.trim(),\n          email,\n          website_or_product_link: s.link.trim(),\n          budget: budgetLabels[s.budget] || \"Not specified\",\n          message: s.detail.trim() || \"No details provided.\",\n        }),\n      });\n      const result = await response.json().catch(() => ({}));\n      if (!response.ok || !result.success) throw new Error(result.message || \"Unable to send request right now.\");\n      this.setState({ name: \"\", email: \"\", link: \"\", detail: \"\", budget: \"\", submitted: true, submitting: false });\n    } catch (error) {\n      this.setState({ submitting: false, submissionError: (error && error.message) || \"Unable to send request right now. Please email hello@bgmc-technologies.co.uk.\" });\n    }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const set = (k) => (e) => this.setState({ [k]: e.target.value });\n    const angle = this.props.heroAngle ?? \"leaking\";\n    const statusByStep = [\n      \"listening for enquiries\",\n      \"enquiry received\",\n      \"reading and classifying\",\n      \"drafting the reply\",\n      \"waiting for one tap from you\",\n      \"lead handled\",\n    ];\n    return {\n      heroLeaking: angle === \"leaking\",\n      heroIgnored: angle === \"ignored\",\n      heroSpeed: angle === \"speed\",\n      row1: this.row(1), row2: this.row(2), row3: this.row(3), row4: this.row(4), row5: this.row(5),\n      demoStatus: statusByStep[s.demoStep] || statusByStep[0],\n      demoPunchline: s.demoStep >= 5 ? \"your part took 19 seconds\" : \"\",\n      onReplay: () => this.playDemo(),\n      showPricing: this.props.showPricing ?? true,\n      showStickyCta: this.props.showStickyCta ?? true,\n      name: s.name, email: s.email, link: s.link, detail: s.detail,\n      onName: set(\"name\"), onEmail: set(\"email\"), onLink: set(\"link\"), onDetail: set(\"detail\"),\n      notSubmitted: !s.submitted,\n      submitted: s.submitted,\n      submissionError: s.submissionError,\n      submitLabel: s.submitting ? \"Sending...\" : \"Send my Fix List request\",\n      onSubmit: () => this.submitForm(),\n      onBudA: () => this.setState({ budget: \"a\" }),\n      onBudB: () => this.setState({ budget: \"b\" }),\n      onBudC: () => this.setState({ budget: \"c\" }),\n      onBudD: () => this.setState({ budget: \"d\" }),\n      onBudE: () => this.setState({ budget: \"e\" }),\n      cbA: this.chip(s.budget === \"a\"),\n      cbB: this.chip(s.budget === \"b\"),\n      cbC: this.chip(s.budget === \"c\"),\n      cbD: this.chip(s.budget === \"d\"),\n      cbE: this.chip(s.budget === \"e\"),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
